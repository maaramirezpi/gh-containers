name: Test project

on: 
  - push
  - workflow_dispatch

jobs:
  eploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "$ {{ toJson(github.event )}}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Build project
        run: npm run build
      - name: deploy
        run: echo "Deploying..."